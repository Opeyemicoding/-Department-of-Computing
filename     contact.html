<!DOCTYPE html>
<html>
<head>
    <title>Contact Us - Department of Computing</title>
   <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <h1>Contact the Department of Computing</h1>

    <p>We welcome enquiries from prospective students, current students and visitors.</p>

    <h2>Contact Information</h2>
    <p>Email: computing@example.com</p>
    <p>Office: Department of Computing</p>

    <h2>Send Us a Message</h2>
    <form>
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message"></textarea><br><br>

        <button type="submit">Submit</button>
    </form>

    <p><a href="index.html">Back to Home</a></p>

</body>
</html>
